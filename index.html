<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Wizards Run">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Wizards Run</title><link rel="stylesheet" href="style.css">
</head><body><main class="app">
<header class="topbar"><div><div class="eyebrow">WIZARDS RUN</div><h1>Run Counter</h1></div><button id="installBtn" class="icon-btn hidden">＋</button></header>
<section id="homeView" class="view"><div id="activeCard"></div><button id="newRunBtn" class="primary big">＋ Démarrer un Run</button><div class="section-head"><h2>Statistiques globales</h2></div><div class="global-filter"><label><input type="radio" name="globalFilter" value="all" checked><span>TOUTES LES PARTIES</span></label><label><input type="radio" name="globalFilter" value="meta"><span>META UNIQUEMENT</span></label></div><div id="globalStats"></div><div class="section-head"><h2>Historique</h2><button id="clearBtn" class="text-btn">Effacer</button></div><div id="history"></div></section>
<section id="runView" class="view hidden"><div class="run-header"><button id="backBtn" class="text-btn">← Accueil</button><span id="runNumber"></span></div><div id="runMeta"></div><div class="score-card"><div class="score-main"><span id="partCount">0</span><small>parties</small></div><div class="score-split"><span id="wins" class="win">0 wins</span><span id="losses" class="loss">0 losses</span></div></div><button id="addPartBtn" class="primary big">＋ Nouvelle partie</button><div class="section-head"><h2>Parties</h2></div><div id="parts"></div><button id="finishBtn" class="secondary big">Terminer le Run</button></section>
<section id="startView" class="view hidden"><div class="run-header"><button id="cancelStartBtn" class="text-btn">← Annuler</button><span>Nouveau Run</span></div><h2>Configure ton Run</h2><label class="field-label">Rank</label><div class="rank-grid"><button class="rank" data-rank="Platine">Platine</button><button class="rank" data-rank="Diamant">Diamant</button><button class="rank" data-rank="Mythic">Mythic</button></div><label class="field-label">Deck sélectionné</label><textarea id="deckDesc" maxlength="500" placeholder="Ex. Mono Red Aggro — version BO1, 60 cartes..."></textarea><button id="confirmStartBtn" class="primary big">Démarrer le Run</button></section>
<section id="partView" class="view hidden"><div class="run-header"><button id="cancelPartBtn" class="text-btn">← Annuler</button><span id="partTitle">Nouvelle partie</span></div><h2>Comment s'est passée<br>la partie ?</h2><div class="part-options">
<div class="option-label">Je commence la partie ?</div>
<div class="segmented"><label><input type="radio" name="mode" value="play" checked><span>▶ PLAY</span></label><label><input type="radio" name="mode" value="draw"><span>DRAW</span></label></div>
<div class="option-label">Deck adverse</div>
<div class="segmented"><label><input type="radio" name="opponent" value="meta" checked><span>META</span></label><label><input type="radio" name="opponent" value="atypical"><span>ATYPIQUE</span></label></div>
<div class="option-label">Mana</div>
<div class="segmented three"><label><input type="radio" name="mana" value="death"><span>DEATH</span></label><label><input type="radio" name="mana" value="ok" checked><span>OK</span></label><label><input type="radio" name="mana" value="flood"><span>FLOOD</span></label></div>
<div class="option-label">As-tu eu 3 lands au tour 3 ?</div>
<div class="segmented"><label><input type="radio" name="landT3" value="yes" checked><span>OUI</span></label><label><input type="radio" name="landT3" value="no"><span>NON</span></label></div>
</div><div class="result-grid"><button class="result win" data-result="freeWin"><b>FREE WIN</b><small>Victoire facile</small></button><button class="result win" data-result="goodWin"><b>GOOD WIN</b><small>Victoire maîtrisée</small></button><button class="result lucky" data-result="luckyWin"><b>LUCKY WIN</b><small>Victoire avec réussite</small></button><button class="result loss" data-result="badLuckLoose"><b>BAD LUCK LOOSE</b><small>Défaite par malchance</small></button><button class="result loss" data-result="hardLoose"><b>HARD LOOSE</b><small>Défaite difficile</small></button><button class="result loss" data-result="freeLoose"><b>FREE LOOSE</b><small>Défaite évitable</small></button></div></section>
<section id="detailView" class="view hidden"><div class="run-header"><button id="detailBackBtn" class="text-btn">← Accueil</button><span id="detailTitle"></span></div><div id="detailContent"></div></section>
</main><script src="app.js"></script></body></html>
